<body>
<div id="app"></div>
<script>
(function(){
'use strict';

const TYPES = {
    character: ['Character', '●', '#688dbb'], lore: ['Lore', '▤', '#9e8350'], spell: ['Ability', '✦', '#8b78b7'],
    faction: ['Faction', '◆', '#579582'], location: ['Location', '⌖', '#5f8fa8'], item: ['Item', '◇', '#a38f59'],
    quest: ['Quest', '⚑', '#a77488'], image: ['Image', '▧', '#6f91a8'], group: ['Frame', '□', '#818c98']
};

const uid = p => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
const cp = o => JSON.parse(JSON.stringify(o));
const blank = () => ({ name: 'Untitled', content: '', tag: '', status: 'Draft', role: '', alignment: '', school: '', cost: '', region: '', leader: '', blocks: [] });

const seed = {
    nodes: [
        { id: 'g1', type: 'group', x: 70, y: 70, width: 820, height: 540, data: { ...blank(), name: 'ARC I · THE SUNDERING', content: 'Main narrative frame.' } },
        { id: 'c1', type: 'character', x: 120, y: 145, width: 320, height: 205, data: { ...blank(), name: 'Elara Moonwhisper', role: 'Arcane Scholar', alignment: 'Chaotic Good', tag: 'Protagonist', status: 'Active', content: 'Exiled from the High Tower for pursuing forbidden chronomancy. Searching for the lost shards of the Aethel.' } },
        { id: 'l1', type: 'lore', x: 515, y: 135, width: 320, height: 190, data: { ...blank(), name: 'The Sundering of Time', tag: 'History', status: 'Established', content: 'The high mages attempted to rewrite history. The ritual fractured the timeline.' } },
        { id: 's1', type: 'spell', x: 515, y: 380, width: 320, height: 190, data: { ...blank(), name: 'Chrono-Phase', school: 'Chronomancy', cost: '40 Mana', tag: 'Ability', status: 'Stable', content: 'Shifts the caster out of the standard timeline for three seconds.' } },
        { id: 'loc1', type: 'location', x: 940, y: 165, width: 320, height: 190, data: { ...blank(), name: 'Aethelgard Citadel', region: 'Northern Spires', tag: 'Location', status: 'Ruined', content: 'A broken citadel suspended above a permanent time fracture.' } },
        { id: 'f1', type: 'faction', x: 940, y: 410, width: 320, height: 190, data: { ...blank(), name: 'High Tower', leader: 'Council of Nine', tag: 'Faction', status: 'Hostile', content: 'The magical order responsible for the failed ritual.' } }
    ],
    edges: [{ id: 'e1', source: 'c1', target: 'l1', label: 'Triggered' }, { id: 'e2', source: 'c1', target: 's1', label: 'Mastered' }, { id: 'e3', source: 'l1', target: 'loc1', label: 'Created' }, { id: 'e4', source: 'f1', target: 'l1', label: 'Caused' }],
    assets: [], collections: []
};

let saved;
try { saved = JSON.parse(localStorage.getItem('langi-fixed-final')) } catch (e) { };
const S = saved && Array.isArray(saved.nodes) ? saved : cp(seed);

const state = {
    project: S, view: 'canvas', selected: [], tab: 'details', dbSearch: '', dbFilter: 'all', dbStatus: 'all', activeDatabase: 'default',
    navOpen: true, navSearch: '', minimap: true, gridOn: true, snapOn: false, gridSize: 30, selectedEdge: null,
    timelineSearch: '', commandPalette: false, commandSearch: '', typeManager: false, assetFolder: 'root', assetSearch: '', assetEditor: null,
    camera: { x: 90, y: 55, z: 0.78 }, menu: null, marquee: null, marqueeMoved: false,
    pan: null, drag: null, resize: null, connect: null, space: false, actions: false, entityMenu: false, infoModal: null, history: [], future: [], toast: ''
};

function ensureDatabaseSchema(){
    if (!Array.isArray(state.project.databases) || !state.project.databases.length) {
        state.project.databases = [{ id:'default', name:'Default Database', description:'All project entities', nodeIds:null, system:true }];
        save();
    }
    if (!state.project.databases.some(d => d.id === 'default')) state.project.databases.unshift({ id:'default', name:'Default Database', description:'All project entities', nodeIds:null, system:true });
    state.project.databases.forEach(d => { if (!Array.isArray(d.nodeIds) && d.nodeIds !== null) d.nodeIds=[]; if (!d.description) d.description=d.system?'All project entities':'Custom entity database'; });
    if (!state.project.databases.some(d => d.id === state.activeDatabase)) state.activeDatabase = 'default';
}
ensureDatabaseSchema();
function ensureFeatureSchema(){
    if(!state.project.canvasBackground) state.project.canvasBackground='#f6f7f8';
    if(!Array.isArray(state.project.timeline)) state.project.timeline=[];
    if(!Array.isArray(state.project.savedViews)) state.project.savedViews=[];
    if(!Array.isArray(state.project.customTypes)) state.project.customTypes=[];
    state.project.nodes.forEach(n=>{ if(n.parentId===undefined) n.parentId=null; if(n.locked===undefined) n.locked=false; });
    state.project.edges.forEach(e=>{ if(!e.color)e.color='#28a85d'; if(!e.style)e.style='solid'; if(!e.label)e.label='Linked'; });
    state.project.customTypes.forEach(t=>{ if(t&&t.id&&!TYPES[t.id]) TYPES[t.id]=[t.name||'Custom',t.icon||'◆',t.color||'#7b8fa3']; });
    if(!Array.isArray(state.project.assetFolders) || !state.project.assetFolders.length) state.project.assetFolders=[{id:'root',name:'Root',system:true}];
    if(!state.project.assetFolders.some(f=>f.id==='root')) state.project.assetFolders.unshift({id:'root',name:'Root',system:true});
    state.project.assets.forEach(a=>{ if(!a.folderId) a.folderId='root'; if(!a.type) a.type='Image'; });
    if(!state.project.assetFolders.some(f=>f.id===state.assetFolder)) state.assetFolder='root';
}
ensureFeatureSchema();

const $ = s => document.querySelector(s);
const app = $('#app');

function save() { localStorage.setItem('langi-fixed-final', JSON.stringify(state.project)) }
let toastTimer, liveSaveTimer;
function saveSoon() { clearTimeout(liveSaveTimer); liveSaveTimer = setTimeout(save, 120); }
function toast(m) { state.toast = m; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = ''; render() }, 1400) }
function commit(next) { state.history.push(cp(state.project)); if (state.history.length > 50) state.history.shift(); state.future = []; state.project = next; save() }
function mutate(fn) { const n = fn(cp(state.project)); commit(n) }
function selectedNode() { return state.selected.length === 1 ? state.project.nodes.find(n => n.id === state.selected[0]) : null }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) }
function screenToWorld(clientX, clientY) { const r = $('.canvas').getBoundingClientRect(); return { x: (clientX - r.left - state.camera.x) / state.camera.z, y: (clientY - r.top - state.camera.y) / state.camera.z } }
function addNode(type, x, y) {
    const isGroup = type === 'group', isImage = type === 'image';
    const firstAsset = state.project.assets[0];
    const data = { ...blank(), name: isImage ? 'New Image' : 'New ' + TYPES[type][0], tag: TYPES[type][0], ...(isImage ? { imageExpanded: false } : {}) };
    if (isImage && firstAsset) {
        data.blocks = [{ id: uid('block'), type: 'image', title: 'Image', assetId: firstAsset.id, url: firstAsset.url }];
    }
    const n = { id: uid(type), type, x: x ?? ((340 - state.camera.x) / state.camera.z), y: y ?? ((160 - state.camera.y) / state.camera.z), width: isGroup ? 420 : (isImage ? 360 : 320), height: isGroup ? 280 : (isImage ? 240 : 190), data };
    mutate(p => ({ ...p, nodes: [n, ...p.nodes] }));
    state.selected = [n.id]; state.tab = isImage ? 'content' : 'details'; state.menu = null; state.entityMenu = false; render();
    if (isImage && firstAsset?.url) requestAnimationFrame(() => fitNodeToImage(n.id));
}

function deleteSelected() {
    if (!state.selected.length) return;
    const ids = [...state.selected];
    mutate(p => ({
        ...p,
        nodes: p.nodes.filter(n => !ids.includes(n.id)),
        edges: p.edges.filter(e => !ids.includes(e.source) && !ids.includes(e.target)),
        collections: (p.collections || []).map(c => ({ ...c, nodeIds: c.nodeIds.filter(id => !ids.includes(id)) })).filter(c => c.nodeIds.length)
    }));
    state.selected = []; state.actions = false; render();
}

function duplicate(id) {
    const n = state.project.nodes.find(n => n.id === id); if (!n) return;
    const c = { ...cp(n), id: uid(n.type), x: n.x + 36, y: n.y + 36, data: { ...cp(n.data), name: (n.data.name || 'Untitled') + ' Copy' } };
    mutate(p => ({ ...p, nodes: [c, ...p.nodes] }));
    state.selected = [c.id]; render();
}

function makeGroup() {
    if (!state.selected.length) return;
    const ns = state.project.nodes.filter(n => state.selected.includes(n.id)); if (!ns.length) return;
    const minX = Math.min(...ns.map(n => n.x)) - 24, minY = Math.min(...ns.map(n => n.y)) - 46, maxX = Math.max(...ns.map(n => n.x + n.width)) + 24, maxY = Math.max(...ns.map(n => n.y + n.height)) + 24;
    const g = { id: uid('group'), type: 'group', x: minX, y: minY, width: maxX - minX, height: maxY - minY, data: { ...blank(), name: 'New Frame', content: 'Grouped entities.' } };
    mutate(p => ({ ...p, nodes: [g, ...p.nodes].map(x=>state.selected.includes(x.id)&&x.type!=='group'?{...x,parentId:g.id}:x) }));
    state.selected = [g.id]; state.actions = false; state.menu = null; render();
}

function makeCollection() {
    if (!state.selected.length) return;
    const c = { id: uid('collection'), name: 'Collection ' + (((state.project.collections || []).length) + 1), nodeIds: [...state.selected] };
    mutate(p => ({ ...p, collections: [...(p.collections || []), c] }));
    state.actions = false; state.menu = null; toast('Collection created');
}

function boxIds(m) {
    const x1 = Math.min(m.sx, m.ex), x2 = Math.max(m.sx, m.ex), y1 = Math.min(m.sy, m.ey), y2 = Math.max(m.sy, m.ey);
    return state.project.nodes.filter(n => n.type !== 'group' && n.x < x2 && n.x + n.width > x1 && n.y < y2 && n.y + n.height > y1).map(n => n.id);
}

function zoomAt(f, cx, cy) {
    const r = $('.canvas').getBoundingClientRect(), px = cx - r.left, py = cy - r.top, nz = Math.max(.2, Math.min(2.5, state.camera.z * f)), wx = (px - state.camera.x) / state.camera.z, wy = (py - state.camera.y) / state.camera.z;
    state.camera = { x: px - wx * nz, y: py - wy * nz, z: nz };
    renderCanvasOnly();
}

function fit() {
    const ns = state.project.nodes; if (!ns.length) return;
    const r = $('.canvas').getBoundingClientRect(), minX = Math.min(...ns.map(n => n.x)), minY = Math.min(...ns.map(n => n.y)), maxX = Math.max(...ns.map(n => n.x + n.width)), maxY = Math.max(...ns.map(n => n.y + n.height));
    const z = Math.max(.25, Math.min(1.1, (r.width - 120) / (maxX - minX + 120), (r.height - 100) / (maxY - minY + 120)));
    state.camera = { x: (r.width - (maxX - minX) * z) / 2 - minX * z, y: (r.height - (maxY - minY) * z) / 2 - minY * z, z };
    renderCanvasOnly();
}

function focus() {
    const n = selectedNode(); if (!n) return;
    const r = $('.canvas').getBoundingClientRect();
    state.camera = { x: r.width / 2 - (n.x + n.width / 2) * state.camera.z, y: r.height / 2 - (n.y + n.height / 2) * state.camera.z, z: state.camera.z };
    renderCanvasOnly();
}

function renderCanvasOnly() {
    if (state.view !== 'canvas') return;
    const w = $('.world');
    if (w) w.style.transform = `translate(${state.camera.x}px,${state.camera.y}px) scale(${state.camera.z})`;
    const g = $('.grid');
    if (g) {
        g.style.backgroundPosition = `${state.camera.x}px ${state.camera.y}px`;
        g.style.backgroundSize = `${60 * state.camera.z}px ${60 * state.camera.z}px`;
    }
    const zl = $('[data-zoom-label]');
    if (zl) zl.textContent = Math.round(state.camera.z * 100) + '%';
    refreshEdgeOverlay();
    if(state.minimap) drawMinimap();
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function fitNodeToImage(nodeId) {
    const n = state.project.nodes.find(x => x.id === nodeId);
    if (!n || n.type === 'group') return;
    const block = (n.data?.blocks || []).find(b => b.type === 'image' && b.url);
    if (!block) return;
    const img = new Image();
    img.onload = () => {
        const ratio = img.naturalWidth && img.naturalHeight ? img.naturalHeight / img.naturalWidth : 0.75;
        const targetWidth = clamp(img.naturalWidth || 420, 320, 520);
        const nodeEl = document.querySelector(`[data-node="${nodeId}"]`);
        const oldWidth = n.width;
        n.width = Math.round(targetWidth);
        if (nodeEl) nodeEl.style.width = n.width + 'px';
        const renderedImg = nodeEl?.querySelector('.image-block img');
        if (renderedImg) renderedImg.style.width = '100%';
        const measured = nodeEl ? nodeEl.scrollHeight : 0;
        const fallbackHeight = 40 + 20 + 66 + Math.round(targetWidth * ratio) + 18;
        n.height = n.type === 'image' ? Math.max(180, Math.round(targetWidth * ratio + 60)) : Math.max(190, Math.round(measured || fallbackHeight));
        if (oldWidth !== n.width) n.x = Math.round(n.x);
        save();
        renderCanvasOnly();
        const live = document.querySelector(`[data-node="${nodeId}"]`);
        if (live) { live.style.width = n.width + 'px'; live.style.height = n.height + 'px'; }
    };
    img.src = block.url;
}

function blockHtml(b) {
    if(b.type==='table') return `<div class="block"><div class="block-title">${esc(b.title)}</div><table><thead><tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.slice(0,4).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(b.type==='graph'){const max=Math.max(1,...b.items.map(x=>Number(x.value)||0));return `<div class="block"><div class="block-title">${esc(b.title)}</div>${b.items.slice(0,5).map(i=>`<div class="bar-row"><div class="bar-head"><span>${esc(i.label)}</span><span>${Number(i.value)||0}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,(Number(i.value)||0)/max*100))}%"></div></div></div>`).join('')}</div>`}
    if(b.type==='heading') return `<div class="block node-heading">${esc(b.text||'Heading')}</div>`;
    if(b.type==='quote') return `<blockquote class="block">${esc(b.text||'Quote')}</blockquote>`;
    if(b.type==='checklist') return `<div class="block"><div class="block-title">${esc(b.title||'Checklist')}</div>${(b.items||[]).map(i=>`<div class="check-row">${i.done?'☑':'☐'} ${esc(i.text||'Item')}</div>`).join('')}</div>`;
    if(b.type==='divider') return `<div class="divider"></div>`;
    return `<div class="block image-block"><div class="block-title">${esc(b.title||'Image')}</div>${b.url?`<img src="${b.url}" alt="">`:'<div class="muted">No image selected.</div>'}</div>`;
}

function activeDatabaseObj(){ return state.project.databases.find(d=>d.id===state.activeDatabase) || state.project.databases[0]; }

function typeKeys(){ return Object.keys(TYPES).filter(k=>k!=='group'); }
function typeDef(type){ return TYPES[type] || ['Custom','◆','#7b8fa3']; }
function snapValue(v){ return state.snapOn ? Math.round(v/state.gridSize)*state.gridSize : v; }
function toggleGrid(){ state.gridOn=!state.gridOn; render(); }
function autoLayout(){
    const nodes=state.project.nodes.filter(n=>n.type!=='group');
    if(nodes.length<2){toast('Need at least two nodes');return;}
    const ids=new Set(nodes.map(n=>n.id)); const indeg=new Map(nodes.map(n=>[n.id,0])); const out=new Map(nodes.map(n=>[n.id,[]]));
    state.project.edges.forEach(e=>{if(ids.has(e.source)&&ids.has(e.target)){out.get(e.source).push(e.target);indeg.set(e.target,indeg.get(e.target)+1)}});
    const layers=[]; let q=nodes.filter(n=>indeg.get(n.id)===0).map(n=>n.id), seen=new Set();
    if(!q.length) q=[nodes[0].id];
    while(q.length){const layer=[...q];layers.push(layer);q=[];layer.forEach(id=>{seen.add(id);(out.get(id)||[]).forEach(t=>{indeg.set(t,indeg.get(t)-1);if(indeg.get(t)===0)q.push(t)})})}
    nodes.filter(n=>!seen.has(n.id)).forEach((n,i)=>{if(!layers.length)layers.push([]);layers[layers.length-1].push(n.id)});
    state.history.push(cp(state.project));if(state.history.length>50)state.history.shift();state.future=[];
    layers.forEach((layer,li)=>layer.forEach((id,ri)=>{const n=state.project.nodes.find(x=>x.id===id);if(n){n.x=snapValue(80+li*380);n.y=snapValue(90+ri*220)}}));save();render();toast('Graph organized');
}
function alignSelected(mode){
    const ns=state.project.nodes.filter(n=>state.selected.includes(n.id));if(ns.length<2)return;const base=ns[0];
    ns.slice(1).forEach(n=>{if(mode==='left')n.x=base.x;if(mode==='center')n.x=base.x+(base.width-n.width)/2;if(mode==='right')n.x=base.x+base.width-n.width;if(mode==='top')n.y=base.y;if(mode==='middle')n.y=base.y+(base.height-n.height)/2;if(mode==='bottom')n.y=base.y+base.height-n.height});
    state.history.push(cp(state.project));if(state.history.length>50)state.history.shift();state.future=[];save();render();
}

function getMinimapTransform(){

 if(!cvs||!ns.length) return null;
 const pad=24, W=cvs.width, H=cvs.height;
 let minX=Math.min(...ns.map(n=>n.x)), minY=Math.min(...ns.map(n=>n.y));

 const spanX=Math.max(1,maxX-minX), spanY=Math.max(1,maxY-minY);
 const scale=Math.min((W-pad*2)/spanX,(H-pad*2)/spanY);
 const ox=pad+(W-pad*2-spanX*scale)/2-minX*scale;
 const oy=pad+(H-pad*2-spanY*scale)/2-minY*scale;

}
function worldToMinimap(t,x,y){return {x:t.ox+x*t.scale,y:t.oy+y*t.scale};}

 (state.project.edges||[]).forEach(e=>{const a=ns.find(n=>n.id===e.source),b=ns.find(n=>n.id===e.target);if(!a||!b)return;const p1=worldToMinimap(t,a.x+a.width,a.y+a.height/2),p2=worldToMinimap(t,b.x,b.y+b.height/2);ctx.strokeStyle='rgba(51,177,95,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.bezierCurveTo((p1.x+p2.x)/2,p1.y,(p1.x+p2.x)/2,p2.y,p2.x,p2.y);ctx.stroke();});
 ns.forEach(n=>{const p=worldToMinimap(t,n.x,n.y),w=Math.max(5,n.width*t.scale),h=Math.max(4,n.height*t.scale);ctx.fillStyle=n.type==='group'?'rgba(125,138,150,.25)':'rgba(119,144,168,.78)';ctx.fillRect(p.x,p.y,w,h);ctx.strokeStyle=state.selected.includes(n.id)?'#fff':'rgba(220,228,235,.38)';ctx.lineWidth=state.selected.includes(n.id)?3:1;ctx.strokeRect(p.x,p.y,w,h);});

function minimapNavigate(clientX,clientY){

function portPoint(n, side) {
    return { x: side === 'output' ? n.x + n.width : n.x, y: n.y + n.height / 2 };
}

function worldToScreenPoint(p) {
    return { x: state.camera.x + p.x * state.camera.z, y: state.camera.y + p.y * state.camera.z };
}

function edgePathData(p1, p2) {
    const gap = Math.max(50, Math.abs(p2.x - p1.x) * 0.42);
    return `M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} C${(p1.x + gap).toFixed(1)} ${p1.y.toFixed(1)}, ${(p2.x - gap).toFixed(1)} ${p2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
}

function edgesSvgContent(eds, ns) {
    const paths = eds.map(e => {
        const a = ns.find(n => n.id === e.source), b = ns.find(n => n.id === e.target);
        if (!a || !b) return '';
        const p1 = worldToScreenPoint(portPoint(a, 'output')), p2 = worldToScreenPoint(portPoint(b, 'input'));
        const d = edgePathData(p1, p2);
        const labelX = (p1.x + p2.x) / 2, labelY = (p1.y + p2.y) / 2 - 8;
        const dash=e.style==='dashed'?'8 6':e.style==='dotted'?'2 6':''; const color=esc(e.color||'#28a85d'); return `<path class="connection-hit" data-edge="${e.id}" d="${d}"/><path class="connection-line ${state.selectedEdge===e.id?'connection-selected':''}" data-edge="${e.id}" d="${d}" stroke="${color}" ${dash?`stroke-dasharray="${dash}"`:''}/><text class="connection-label" x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" style="fill:${color}" text-anchor="middle">${esc(e.label || 'Linked')}</text>`;
    }).join('');
    return paths;
}

function connectionPreviewSvgContent() {
    const c = state.connect; if (!c) return '';
    const p1 = worldToScreenPoint({ x: c.x, y: c.y }), p2 = worldToScreenPoint({ x: c.mx, y: c.my });
    return `<path class="connection-preview" d="${edgePathData(p1, p2)}"/>`;
}

function nodeHtml(n) {

function assetFolderObj(id){ return (state.project.assetFolders||[]).find(f=>f.id===id) || (state.project.assetFolders||[]).find(f=>f.id==='root'); }
function openAssetEditor(id){
    const a=state.project.assets.find(x=>x.id===id); if(!a) return;
    const img=new Image(); img.onload=()=>{
        state.assetEditor={id,src:a.url,sourceW:img.naturalWidth||1,sourceH:img.naturalHeight||1,cropX:0,cropY:0,cropW:img.naturalWidth||1,cropH:img.naturalHeight||1,resizeW:img.naturalWidth||1,resizeH:img.naturalHeight||1,rotate:0,flipX:false,flipY:false};
        render(); requestAnimationFrame(drawAssetEditorPreview);
    }; img.src=a.url;
}
function closeAssetEditor(){ state.assetEditor=null; render(); }
function normalizeEditor(){
    const e=state.assetEditor; if(!e) return;
    e.cropX=clamp(Math.round(Number(e.cropX)||0),0,Math.max(0,e.sourceW-1));
    e.cropY=clamp(Math.round(Number(e.cropY)||0),0,Math.max(0,e.sourceH-1));
    e.cropW=clamp(Math.round(Number(e.cropW)||1),1,Math.max(1,e.sourceW-e.cropX));
    e.cropH=clamp(Math.round(Number(e.cropH)||1),1,Math.max(1,e.sourceH-e.cropY));
    e.resizeW=clamp(Math.round(Number(e.resizeW)||e.cropW),1,12000);
    e.resizeH=clamp(Math.round(Number(e.resizeH)||e.cropH),1,12000);
}
function drawAssetEditorPreview(){
    const e=state.assetEditor, cvs=document.querySelector('[data-asset-editor-canvas]'); if(!e||!cvs) return;
    normalizeEditor(); const img=new Image(); img.onload=()=>{
        let outW=e.resizeW, outH=e.resizeH; if(e.rotate===90||e.rotate===270){const t=outW;outW=outH;outH=t;}
        cvs.width=Math.max(1,outW); cvs.height=Math.max(1,outH);
        const ctx=cvs.getContext('2d'); ctx.clearRect(0,0,cvs.width,cvs.height); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
        ctx.save(); ctx.translate(cvs.width/2,cvs.height/2); ctx.rotate((e.rotate||0)*Math.PI/180); ctx.scale(e.flipX?-1:1,e.flipY?-1:1);
        const dw=e.resizeW, dh=e.resizeH; ctx.drawImage(img,e.cropX,e.cropY,e.cropW,e.cropH,-dw/2,-dh/2,dw,dh); ctx.restore();
        const badge=document.querySelector('[data-editor-size]'); if(badge) badge.textContent=`Preview ${cvs.width} × ${cvs.height}px`;
    }; img.src=e.src;
}
function updateEditorField(field,value){ const e=state.assetEditor; if(!e)return; e[field]=Number.isFinite(+value)?+value:value; normalizeEditor(); drawAssetEditorPreview(); }
async function applyAssetEditor(){
    const e=state.assetEditor; if(!e)return; normalizeEditor();
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=e.src;});
    let outW=e.resizeW,outH=e.resizeH;if(e.rotate===90||e.rotate===270){const t=outW;outW=outH;outH=t;}
    const cvs=document.createElement('canvas'); cvs.width=outW; cvs.height=outH; const ctx=cvs.getContext('2d'); ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.translate(outW/2,outH/2);ctx.rotate((e.rotate||0)*Math.PI/180);ctx.scale(e.flipX?-1:1,e.flipY?-1:1);ctx.drawImage(img,e.cropX,e.cropY,e.cropW,e.cropH,-e.resizeW/2,-e.resizeH/2,e.resizeW,e.resizeH);
    const url=cvs.toDataURL('image/png');
    const a=state.project.assets.find(x=>x.id===e.id);if(!a)return;
    const oldUrl=a.url;
    a.url=url;a.width=outW;a.height=outH;
    state.project.nodes.forEach(n=>{n.data=(n.data&&n.data.blocks)?{...n.data,blocks:n.data.blocks.map(b=>b.assetId===a.id?{...b,url}:b)}:n.data;});
    save();state.assetEditor=null;render();requestAnimationFrame(()=>{state.project.nodes.forEach(n=>{if((n.data?.blocks||[]).some(b=>b.type==='image'&&b.assetId===a.id))fitNodeToImage(n.id);});});
    toast('Image updated');
}

function updateNodeFieldLive(id, field, value) {
    const n = state.project.nodes.find(x => x.id === id);
    if (!n) return;
    n.data = { ...n.data, [field]: value };
    saveSoon();
    const el = document.querySelector(`[data-node="${id}"]`);
    if (!el) return;
    if (field === 'name') {
        const nameEl = el.querySelector('[data-live-name]'); if (nameEl) nameEl.textContent = value || 'Untitled';
        const titleEl = document.querySelector('.inspector .ititle'); if (titleEl) titleEl.textContent = value || 'Untitled';
    } else if (field === 'content') {
        const descEl = el.querySelector('[data-live-description]'); if (descEl) descEl.textContent = value || 'No description yet.';
    } else if (field === 'tag') {
        const tagEl = el.querySelector('[data-live-tag]'); if (tagEl) tagEl.textContent = TYPES[n.type]?.[0] + (value ? ' · ' + value : '');
    } else if (['role','region','school','leader'].includes(field)) {
        const metaValue = n.data.role || n.data.region || n.data.school || n.data.leader || '';
        const metaEl = el.querySelector('[data-live-meta]');
        if (metaEl) { metaEl.textContent = metaValue; metaEl.style.display = metaValue ? '' : 'none'; }
    }
}

async function toggleFullscreen(){
    try{
        if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
    }catch(e){toast('Fullscreen is not available in this browser');}
}
window.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen-active',!!document.fullscreenElement));

    document.querySelectorAll('[data-editor-field]').forEach(el=>el.oninput=()=>{updateEditorField(el.dataset.editorField,el.value)});
    document.querySelectorAll('[data-editor-rotate]').forEach(el=>el.onclick=()=>{const e=state.assetEditor;if(!e)return;const v=Number(el.dataset.editorRotate);e.rotate=v===0?0:((e.rotate+v)%360+360)%360;drawAssetEditorPreview();render();requestAnimationFrame(drawAssetEditorPreview)});
    document.querySelectorAll('[data-editor-flip]').forEach(el=>el.onclick=()=>{const e=state.assetEditor;if(!e)return;if(el.dataset.editorFlip==='x')e.flipX=!e.flipX;else e.flipY=!e.flipY;render();requestAnimationFrame(drawAssetEditorPreview)});

    const ds = $('[data-db-search]'); if (ds) ds.oninput = () => { state.dbSearch = ds.value; render() }; const df = $('[data-db-filter]'); if (df) df.onchange = () => { state.dbFilter = df.value; render() };
    document.querySelectorAll('[data-db-open]').forEach(b=>b.onclick=()=>{state.activeDatabase=b.dataset.dbOpen; state.dbSearch=''; state.dbFilter='all'; render()});
    const dbName=$('[data-db-name]'); if(dbName) dbName.oninput=()=>renameActiveDatabase(dbName.value);
    document.querySelectorAll('[data-db-member]').forEach(el=>el.onchange=()=>toggleDatabaseMember(el.dataset.dbMember,el.checked));
    const infoBackdrop=document.querySelector('[data-info-backdrop]'); if(infoBackdrop) infoBackdrop.onclick=e=>{if(e.target===infoBackdrop) closeInfo()};
    const menu = $('[data-menu]'); if (menu) document.querySelectorAll('[data-create]').forEach(b => b.onclick = () => addNode(b.dataset.create, state.menu.world.x, state.menu.world.y));
    document.querySelectorAll('[data-entity-create]').forEach(b => b.onclick = () => addNode(b.dataset.entityCreate));
    document.querySelectorAll('[data-image-toggle]').forEach(el => el.onclick = e => { e.preventDefault(); e.stopPropagation(); const id = el.dataset.imageToggle; const n = state.project.nodes.find(x => x.id === id); if (!n) return; n.data = { ...n.data, imageExpanded: n.data.imageExpanded !== true }; save(); render(); });
    const imageNodeSelect = $('[data-image-node-select]'); if (imageNodeSelect) imageNodeSelect.onchange = () => { const n = selectedNode(), a = state.project.assets.find(x => x.id === imageNodeSelect.value); if (!n || n.type !== 'image') return; const existing = (n.data.blocks || []).findIndex(b => b.type === 'image'); const block = { id: existing >= 0 ? n.data.blocks[existing].id : uid('block'), type: 'image', title: 'Image', assetId: imageNodeSelect.value, url: a?.url || '' }; const blocks = cp(n.data.blocks || []); if (existing >= 0) blocks[existing] = block; else blocks.push(block); n.data = { ...n.data, blocks, imageExpanded: true }; save(); render(); if (a?.url) requestAnimationFrame(() => fitNodeToImage(n.id)); }
    document.querySelectorAll('[data-nav-node]').forEach(el=>el.onclick=()=>{state.selected=[el.dataset.navNode];state.view='canvas';render();requestAnimationFrame(focus)});
    const nsearch=$('[data-nav-search]'); if(nsearch)nsearch.oninput=()=>{state.navSearch=nsearch.value;render();requestAnimationFrame(()=>{$('[data-nav-search]')?.focus()})};
    const mmp=$('[data-minimap]'); if(mmp){mmp.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();state.minimapDrag=true;minimapNavigate(e.clientX,e.clientY);mmp.setPointerCapture?.(e.pointerId)};mmp.onpointermove=e=>{if(state.minimapDrag){e.preventDefault();minimapNavigate(e.clientX,e.clientY)}};mmp.onpointerup=e=>{state.minimapDrag=false;mmp.releasePointerCapture?.(e.pointerId)};mmp.onpointercancel=()=>{state.minimapDrag=false};}
    const csearch=$('[data-command-search]'); if(csearch)csearch.oninput=()=>{state.commandSearch=csearch.value;render();requestAnimationFrame(()=>{$('[data-command-search]')?.focus()})};
    document.querySelectorAll('[data-type-delete]').forEach(el=>el.onclick=()=>{const id=el.dataset.typeDelete;if(state.project.nodes.some(n=>n.type===id)){toast('Convert or delete nodes using this type first');return}state.project.customTypes=state.project.customTypes.filter(t=>t.id!==id);delete TYPES[id];save();render()});
    document.querySelectorAll('[data-edge-select]').forEach(el=>el.onclick=()=>{state.selectedEdge=el.dataset.edgeSelect;render()});
    document.querySelectorAll('[data-edge-field]').forEach(el=>{const fn=()=>{const edge=state.project.edges.find(e=>e.id===el.dataset.edgeId);if(!edge)return;edge[el.dataset.edgeField]=el.value;saveSoon();refreshEdgeOverlay()};el.oninput=fn;el.onchange=fn});
    const dstatus=$('[data-db-status]'); if(dstatus)dstatus.onchange=()=>{state.dbStatus=dstatus.value;render()};
    const tsearch=$('[data-timeline-search]'); if(tsearch)tsearch.oninput=()=>{state.timelineSearch=tsearch.value;render()};
    document.querySelectorAll('[data-tl-title]').forEach(el=>el.oninput=()=>{const e=state.project.timeline.find(x=>x.id===el.dataset.tlTitle);if(e){e.title=el.value;saveSoon()}});
    document.querySelectorAll('[data-tl-desc]').forEach(el=>el.oninput=()=>{const e=state.project.timeline.find(x=>x.id===el.dataset.tlDesc);if(e){e.description=el.value;saveSoon()}});
    document.querySelectorAll('[data-tl-year]').forEach(el=>el.oninput=()=>{const e=state.project.timeline.find(x=>x.id===el.dataset.tlYear);if(e){e.year=Number(el.value)||0;saveSoon()}});
    document.querySelectorAll('[data-tl-node]').forEach(el=>el.onchange=()=>{const e=state.project.timeline.find(x=>x.id===el.dataset.tlNode);if(e){e.nodeId=el.value;save()}});
    document.querySelectorAll('[data-tl-del]').forEach(el=>el.onclick=()=>deleteTimelineEvent(el.dataset.tlDel));
    document.querySelectorAll('[data-tl-focus]').forEach(el=>el.onclick=()=>{if(!el.dataset.tlFocus)return;state.view='canvas';state.selected=[el.dataset.tlFocus];render();requestAnimationFrame(focus)});
    document.querySelectorAll('[data-b-text]').forEach(el=>el.oninput=()=>{const n=selectedNode(),i=+el.dataset.bText;if(!n)return;const bs=cp(n.data.blocks||[]);bs[i].text=el.value;n.data.blocks=bs;saveSoon();renderCanvasOnly()});
    document.querySelectorAll('[data-b-check-title]').forEach(el=>el.oninput=()=>{const n=selectedNode(),i=+el.dataset.bCheckTitle;if(!n)return;const bs=cp(n.data.blocks||[]);bs[i].title=el.value;n.data.blocks=bs;saveSoon()});
    document.querySelectorAll('[data-b-check]').forEach(el=>el.onchange=()=>{const n=selectedNode(),parts=el.dataset.bCheck.split(':').map(Number);if(!n)return;const bs=cp(n.data.blocks||[]);bs[parts[0]].items[parts[1]].done=el.checked;n.data.blocks=bs;save();render()});
    document.querySelectorAll('[data-b-check-text]').forEach(el=>el.oninput=()=>{const n=selectedNode(),parts=el.dataset.bCheckText.split(':').map(Number);if(!n)return;const bs=cp(n.data.blocks||[]);bs[parts[0]].items[parts[1]].text=el.value;n.data.blocks=bs;saveSoon()});
    document.querySelectorAll('[data-b-check-add]').forEach(el=>el.onclick=()=>{const n=selectedNode(),i=+el.dataset.bCheckAdd;if(!n)return;const bs=cp(n.data.blocks||[]);bs[i].items.push({text:'New item',done:false});n.data.blocks=bs;save();render()});
    document.querySelectorAll('[data-menu-act]').forEach(b => b.onclick = () => { const a = b.dataset.menuAct; if (a === 'select') { if (state.menu.target) state.selected = [state.menu.target]; state.menu = null; render() } else if (a === 'dup') { duplicate(state.menu.target); state.menu = null } else if (a === 'del') { state.selected = [state.menu.target]; state.menu = null; deleteSelected() } else if (a === 'group') makeGroup(); else if (a === 'collection') makeCollection() });
}

function exportJson() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state.project, null, 2)], { type: 'application/json' })); a.download = 'langi-project.json'; a.click(); URL.revokeObjectURL(a.href); toast('Project exported') }
function importJson(f) { const r = new FileReader(); r.onload = () => { try { const p = JSON.parse(r.result); if (!Array.isArray(p.nodes) || !Array.isArray(p.edges) || !Array.isArray(p.assets)) throw 1; commit({ ...p, collections: Array.isArray(p.collections) ? p.collections : [] }); ensureDatabaseSchema(); ensureFeatureSchema(); state.selected = []; state.menu = null; toast('Project imported') } catch (e) { alert('Invalid Langi project file.') } }; r.readAsText(f) }

window.addEventListener('pointerdown', e => { if (state.infoModal) return; if (state.menu && !e.target.closest('[data-menu]')) { state.menu = null; render() } else if (state.entityMenu && !e.target.closest('[data-entity-menu]') && !e.target.closest('[data-act="add-menu"]')) { state.entityMenu = false; render() } });
window.addEventListener('keydown', e => {
    const editing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
    if (e.key === 'Escape') { if(state.typeManager){state.typeManager=false;render();return;} if(state.infoModal){closeInfo();return;} state.menu = null; state.entityMenu = false; state.marquee = null; state.actions = false; state.connect = null; state.resize = null; render(); return }
    if (!editing && e.key === ' ') { state.space = true; e.preventDefault() }
    if (editing) return;
    if (e.key === 'Delete' && state.selected.length) deleteSelected();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (state.history.length) { state.future.unshift(cp(state.project)); state.project = state.history.pop(); save(); render() } }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); if (state.future.length) { state.history.push(cp(state.project)); state.project = state.future.shift(); save(); render() } }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && state.selected.length === 1) { e.preventDefault(); duplicate(state.selected[0]) }
    if (e.ctrlKey&&e.key.toLowerCase()==='h'&&!editing){e.preventDefault();openInfo('help');return;}
    if (e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); state.menu = { x: 120, y: 70, type: 'canvas', target: null, world: { x: (300 - state.camera.x) / state.camera.z, y: (150 - state.camera.y) / state.camera.z } }; render() }
});
window.addEventListener('keyup', e => { if (e.key === ' ') state.space = false });
window.addEventListener('blur', () => { state.space = false }); // Fix getting stuck panning
window.addEventListener('resize', () => { renderCanvasOnly(); });

// Centralized pointer movement to survive DOM re-renders and enable smooth dragging
window.addEventListener('pointermove', e => {
    if (state.resize) {
        const r = state.resize, n = state.project.nodes.find(x => x.id === r.id); if (!n) return;
        const dx = (e.clientX - r.sx) / state.camera.z, dy = (e.clientY - r.sy) / state.camera.z, minW = 180, minH = 110;
        let x = r.x, y = r.y, w = r.w, h = r.h;
        if (r.dir.includes('r')) w = Math.max(minW, r.w + dx);
        if (r.dir.includes('l')) { w = Math.max(minW, r.w - dx); x = r.x + (r.w - w); }
        if (r.dir.includes('b')) h = Math.max(minH, r.h + dy);
        if (r.dir.includes('t')) { h = Math.max(minH, r.h - dy); y = r.y + (r.h - h); }
        n.x = Math.round(snapValue(x)); n.y = Math.round(snapValue(y)); n.width = Math.round(snapValue(w)); n.height = Math.round(snapValue(h));
        const el = document.querySelector(`[data-node="${n.id}"]`); if (el) { el.style.left=n.x+'px'; el.style.top=n.y+'px'; el.style.width=n.width+'px'; el.style.height=n.height+'px'; }
        refreshEdgeOverlay();
        return;
    }
    if (state.connect) {
        const p = screenToWorld(e.clientX, e.clientY);
        state.connect.mx = p.x; state.connect.my = p.y;
        renderCanvasOnly();
        return;
    }
    if (state.pan) { state.camera.x = state.pan.cx + e.clientX - state.pan.sx; state.camera.y = state.pan.cy + e.clientY - state.pan.sy; renderCanvasOnly(); return; }
    if (state.drag) {
        const dn=state.project.nodes.find(x=>x.id===state.drag.id); if(dn?.locked||dn?.data?.locked)return;
        const dx = (e.clientX - state.drag.sx) / state.camera.z, dy = (e.clientY - state.drag.sy) / state.camera.z;
        if (Math.abs(dx) + Math.abs(dy) > 2) state.marqueeMoved = true;
        state.project.nodes.forEach(n => {
            if (state.drag.starts[n.id]) {
                n.x = snapValue(state.drag.starts[n.id].x + dx); n.y = snapValue(state.drag.starts[n.id].y + dy);
                const el = document.querySelector(`[data-node="${n.id}"]`);
                if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
            }
        });
        refreshEdgeOverlay();
        return;
    }
    if (state.marquee) {
        const p = screenToWorld(e.clientX, e.clientY);
        state.marquee.ex = p.x; state.marquee.ey = p.y; state.marqueeMoved = true;
        let box = document.querySelector('.select-box');
        if (!box) { box = document.createElement('div'); box.className = 'select-box'; const canvas = document.querySelector('.canvas'); if (canvas) canvas.appendChild(box); }
        if (box) { box.style.left = Math.min(state.marquee.sx, state.marquee.ex) * state.camera.z + state.camera.x + 'px'; box.style.top = Math.min(state.marquee.sy, state.marquee.ey) * state.camera.z + state.camera.y + 'px'; box.style.width = Math.abs(state.marquee.ex - state.marquee.sx) * state.camera.z + 'px'; box.style.height = Math.abs(state.marquee.ey - state.marquee.sy) * state.camera.z + 'px'; }
    }
});

window.addEventListener('pointerup', e => {
    if (state.resize) {
        state.history.push(cp(state.project)); if (state.history.length > 50) state.history.shift(); state.future = []; save(); state.resize = null; render(); return;
    }
    if (state.connect) {
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const port = hit?.closest('[data-port]');
        const source = state.connect.source;
        const target = port?.dataset.port === 'input' ? port.dataset.node : null;
        if (target && target !== source && !state.project.edges.some(x => x.source === source && x.target === target)) {
            const next = { id: uid('edge'), source, target, label: 'Linked' };
            state.history.push(cp(state.project));
            if (state.history.length > 50) state.history.shift();
            state.future = [];
            next.color='#28a85d'; next.style='solid'; state.project = { ...state.project, edges: [...state.project.edges, next] }; state.selectedEdge=next.id;
            save();
            toast('Connection created');
        }
        state.connect = null;
        document.querySelector('.canvas')?.classList.remove('connecting');
        render();
        return;
    }
    if (state.pan) { state.pan = null; return; }
    if (state.drag) {
        if (state.marqueeMoved) { save(); state.history.push(cp(state.project)); if (state.history.length > 50) state.history.shift(); state.future = []; }
        state.drag = null; render(); return;
    }
    if (state.marquee) {
        const ids = boxIds(state.marquee), final = state.marquee.shift ? [...new Set([...state.selected, ...ids])] : ids;
        state.selected = final; state.marquee = null;
        if (state.marqueeMoved && final.length) state.actions = true;
        render();
    }
});

const asset = document.createElement('input'); asset.type = 'file'; asset.id = 'asset-file'; asset.accept = 'image/*'; asset.multiple = true; asset.hidden = true;
asset.onchange = () => { const fs = [...asset.files]; Promise.all(fs.map(f => new Promise(res => { const r = new FileReader(); r.onload = () => { const url=r.result; const img=new Image(); img.onload=()=>res({ id: uid('asset'), name: f.name, type: 'Image', url, width: img.naturalWidth||0, height: img.naturalHeight||0, folderId: state.assetFolder||'root' }); img.src=url; }; r.readAsDataURL(f) }))).then(items => { if (items.length) { mutate(p => ({ ...p, assets: [...p.assets, ...items] })); toast(items.length + ' image' + (items.length > 1 ? 's' : '') + ' added') } }); asset.value = '' };
document.body.appendChild(asset);
const jf = document.createElement('input'); jf.type = 'file'; jf.id = 'json-file'; jf.accept = '.json'; jf.hidden = true;
jf.onchange = () => { if (jf.files[0]) importJson(jf.files[0]); jf.value = '' };
document.body.appendChild(jf);

render();
requestAnimationFrame(() => { if (!saved && state.view === 'canvas') fit(); else renderCanvasOnly(); state.project.nodes.forEach(n => { if ((n.data?.blocks || []).some(b => b.type === 'image' && b.url)) fitNodeToImage(n.id); }); });
})();
</script>
